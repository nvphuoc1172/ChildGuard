<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập phụ huynh · ChildGuard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .login-logo h1 {
      font-size: 22px;
      font-weight: 700;
    }
    .error-msg {
      background-color: var(--danger-bg);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🛡️</div>
        <h1>ChildGuard (OGK)</h1>
        <p style="font-size: 13px; color: var(--text-muted);">Đăng nhập bảng điều khiển phụ huynh</p>
      </div>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/dashboard/login">
        <div class="form-group">
          <label class="form-label">Email phụ huynh</label>
          <input type="email" name="email" class="form-input" placeholder="demo@ogk.local" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          Đăng nhập
        </button>
      </form>

      <div style="margin-top: 24px; font-size: 12px; color: var(--text-soft); text-align: center;">
        Tài khoản demo: <code>demo@ogk.local</code> (mật khẩu bất kỳ)
      </div>
    </div>
  </div>
</body>
</html>
